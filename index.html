<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latih Asas - Belajar Jawi & Arab 🕌</title>

    <!-- ============================================================ -->
    <!-- CSS UTAMA + ANIMASI (Semua gaya di sini)                       -->
    <!-- ============================================================ -->
    <style>
        /* ---------- Reset & Asas ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            min-height: 100vh;
            padding: 20px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(-45deg, #fdfbfb, #ebedee, #f8e8e8, #e0eaf5);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ---------- Tajuk Berkilau ---------- */
        h1 {
            font-size: 2.8rem;
            text-align: center;
            color: #2d1e12;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        h1 .glow-text {
            background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 3s linear infinite;
            font-weight: 900;
        }
        @keyframes shineText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        h1 span.icon-big { font-size: 3.2rem; -webkit-text-fill-color: initial; }

        .subtitle {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(6px);
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 1.2rem;
            color: #2d1e12;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }
        .subtitle .emoji-wave {
            display: inline-block;
            animation: waveEmoji 1.8s infinite;
        }
        @keyframes waveEmoji {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }

        /* ---------- Grid Kad Jawi ---------- */
        #jawiGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 22px;
            max-width: 1300px;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
        }

        /* ---------- Kad (dengan animasi terapung) ---------- */
        .jawi-card {
            border-radius: 30px 30px 22px 22px;
            padding: 18px 10px 14px;
            text-align: center;
            box-shadow: 0 10px 0 #b8a68b, 0 12px 30px rgba(0, 0, 0, 0.10);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid rgba(255, 255, 255, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 155px;
            background: #fefcf3;
            animation: floatY 3.5s ease-in-out infinite;
        }
        /* Delay terapung akan ditetapkan oleh JS */
        @keyframes floatY {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .jawi-card:hover {
            transform: scale(1.04) translateY(-4px);
            box-shadow: 0 14px 0 #b8a68b, 0 20px 40px rgba(0, 0, 0, 0.15);
            border-color: #f5c542;
        }
        .jawi-card:active {
            transform: scale(0.96) translateY(4px);
            box-shadow: 0 6px 0 #b8a68b;
        }

        .jawi-card .jawi-char {
            font-size: 4.2rem;
            font-family: 'Traditional Arabic', 'Arabic Typesetting', 'Amiri', serif;
            line-height: 1.1;
            color: #2d1e12;
            margin-bottom: 2px;
            text-shadow: 3px 3px 0 rgba(255, 215, 0, 0.25);
        }
        .jawi-card .letter-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4d3a2a;
            background: rgba(255, 255, 240, 0.8);
            padding: 3px 16px;
            border-radius: 40px;
            margin: 4px 0 8px;
            border: 1px solid #e5d5be;
            backdrop-filter: blur(2px);
        }
        .jawi-card .sample-word {
            font-size: 1.4rem;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            color: #6b4f3a;
            background: #f4ede4;
            padding: 0 14px;
            border-radius: 30px;
            margin: 4px 0;
            opacity: 0.9;
        }

        /* ---------- BUTANG SPEAKER + VISUALIZER ---------- */
        .audio-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }
        .audio-btn {
            background: #f5c542;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #b88a2a;
            transition: all 0.06s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2d1e12;
            z-index: 2;
            position: relative;
        }
        .audio-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #b88a2a;
        }
        .audio-btn.playing {
            background: #ff6b6b;
            box-shadow: 0 4px 0 #b33939;
            animation: pulseGlow 0.6s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 #ff6b6b88; }
            100% { box-shadow: 0 0 20px 8px #ff6b6b44; }
        }

        .wave-box {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 26px;
            width: 24px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .wave-box.active {
            opacity: 1;
        }
        .wave-box span {
            display: block;
            width: 4px;
            height: 8px;
            background: #f5c542;
            border-radius: 6px;
            transition: height 0.1s;
        }
        .wave-box.active span {
            animation: waveBounce 0.5s infinite alternate;
        }
        .wave-box.active span:nth-child(1) { animation-delay: 0s; height: 18px; background: #ff6b6b; }
        .wave-box.active span:nth-child(2) { animation-delay: 0.15s; height: 26px; background: #ffb347; }
        .wave-box.active span:nth-child(3) { animation-delay: 0.3s; height: 12px; background: #f5c542; }

        @keyframes waveBounce {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(1.2); }
        }

        .jawi-card .click-hint {
            font-size: 0.65rem;
            color: #aa9a88;
            margin-top: 4px;
            background: #ede5d8;
            padding: 0 12px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            opacity: 0.7;
        }

        /* ---------- MODAL POPUP ---------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 20, 15, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            animation: modalFadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalFadeIn {
            0% { opacity: 0; transform: scale(0.9) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-content {
            background: #fffffffa;
            max-width: 780px;
            width: 100%;
            padding: 30px 22px 28px;
            border-radius: 50px 50px 40px 40px;
            position: relative;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.35);
            max-height: 90vh;
            overflow-y: auto;
            border: 6px solid #fce3c0;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 2.6rem;
            cursor: pointer;
            color: #ab8a6a;
            background: #f3e8dc;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            transition: 0.2s;
            line-height: 1;
        }
        .modal-close:hover {
            background: #e3d2c0;
            color: #4d2e1a;
            transform: rotate(90deg);
        }

        .modal-title {
            font-size: 2.4rem;
            text-align: center;
            font-weight: 700;
            color: #2d1e12;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .modal-title .big-char {
            font-size: 4.8rem;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            line-height: 1;
        }
        .modal-title .letter-name-big {
            background: #eaddd0;
            padding: 6px 24px;
            border-radius: 60px;
            font-size: 1.8rem;
        }

        .example-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px;
            margin-top: 8px;
        }
        .example-item {
            background: #fcf7f0;
            border-radius: 35px;
            padding: 18px 12px 16px;
            text-align: center;
            box-shadow: 0 6px 0 #d8caba, 0 8px 20px rgba(0, 0, 0, 0.04);
            border: 2px solid #efe4d6;
            transition: 0.15s;
            animation: itemPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .example-item:nth-child(1) { animation-delay: 0.05s; }
        .example-item:nth-child(2) { animation-delay: 0.15s; }
        .example-item:nth-child(3) { animation-delay: 0.25s; }

        @keyframes itemPop {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .example-item .arabic-word {
            font-size: 2.8rem;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            color: #2d1e12;
            line-height: 1.2;
        }
        .example-item .emoji-big {
            font-size: 3.4rem;
            display: block;
            margin: 6px 0 2px;
        }
        .example-item .iqra-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #4a6a3a;
            background: #e6f0e6;
            border-radius: 30px;
            padding: 3px 16px;
            display: inline-block;
            margin: 6px 0 10px;
        }

        .audio-btn-sm {
            background: #ffb347;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #c77d1a;
            transition: 0.05s linear;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #2d1e12;
        }
        .audio-btn-sm:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #c77d1a;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; gap: 6px; }
            #jawiGrid { grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 14px; }
            .jawi-card { min-height: 130px; padding: 12px 6px; }
            .jawi-card .jawi-char { font-size: 3.2rem; }
            .jawi-card .letter-name { font-size: 0.85rem; }
            .modal-content { padding: 20px 12px; }
            .example-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
            .modal-title { font-size: 1.8rem; }
            .modal-title .big-char { font-size: 3.6rem; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <h1>
        <span class="icon-big">🕌</span>
        <span class="glow-text">Belajar Huruf Jawi & Arab</span>
        <span class="icon-big">📖</span>
    </h1>
    <div class="subtitle">
        <span class="emoji-wave">👆</span> Klik kad untuk lihat contoh •
        <span class="emoji-wave">🔊</span> Tekan butang untuk dengar sebutan
        <span style="display:inline-block;animation:waveEmoji 1.4s infinite;">✨</span>
    </div>

    <!-- ===== GRID JAWI ===== -->
    <div id="jawiGrid"></div>

    <!-- ============================================================ -->
    <!-- PAUTAN ASAL (KEKALKAN SEMUA)                                   -->
    <!-- ============================================================ -->
    <script src="arab.js"></script>
    <script src="huruf.js"></script>
    <script src="jawi.js"></script>   <!-- ← SEMUA LOGIK JAWI ADA DI SINI -->
    <script src="latiharab.js"></script>
    <script src="latihjawi.js"></script>
    <script src="latihsukukata.js"></script>
    <script src="latihtajwid.js"></script>
    <script src="matematik.js"></script>

</body>
</html>
